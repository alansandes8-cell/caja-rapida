<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caja Rápida</title>
<meta name="theme-color" content="#F3F5F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Caja">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app — sticky header, scrolling view, fixed bottom tab bar; sale cart rides above the tabs. */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --sunk:#E8ECE6; --line:#D5DBD3;
  --ink:#16201C; --muted:#5D6A64;
  --accent:#0C7A55; --accent-ink:#FFFFFF; --accent-soft:#D7EFE4;
  --cash:#0C7A55; --transfer:#3D5BC9; --transfer-soft:#E1E7FA;
  --warn:#B4610A; --warn-soft:#FBEBD6; --danger:#B42A2A; --danger-soft:#F8DEDE;
  --paper:#FFFDF6;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --line:#2F3B36;
  --ink:#E9EFEC; --muted:#97A59F;
  --accent:#34C08A; --accent-ink:#06130D; --accent-soft:#163A2C;
  --cash:#34C08A; --transfer:#8EA6FF; --transfer-soft:#1F2847;
  --warn:#F0A54E; --warn-soft:#3A2A14; --danger:#F07A7A; --danger-soft:#3C1A1A;
  --paper:#1D2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18201D; --sunk:#222C28; --line:#2F3B36;
  --ink:#E9EFEC; --muted:#97A59F;
  --accent:#34C08A; --accent-ink:#06130D; --accent-soft:#163A2C;
  --cash:#34C08A; --transfer:#8EA6FF; --transfer-soft:#1F2847;
  --warn:#F0A54E; --warn-soft:#3A2A14; --danger:#F07A7A; --danger-soft:#3C1A1A;
  --paper:#1D2421; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok b{background:var(--accent)}

h2{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;margin:6px 0 12px;text-wrap:balance}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px;font-weight:700}
.muted{color:var(--muted)}
.cap::first-letter{text-transform:uppercase}
.stack{display:flex;flex-direction:column;gap:10px}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--ink);
  border-radius:var(--r);padding:10px 12px;font-size:13px;margin-bottom:12px}
.banner button{background:none;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}

.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;margin-bottom:12px}

/* product grid for selling */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:96px;position:relative}
.tile:active{transform:scale(.98)}
.tile .n{font-weight:600;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.tile .p{font-family:var(--f-mono);font-weight:600;font-size:16px;margin-top:auto}
.tile .s{font-size:12px;color:var(--muted)}
.tile.low .s{color:var(--warn);font-weight:600}
.tile.out{opacity:.5}
.tile.out .s{color:var(--danger);font-weight:600}
.tile .q{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:24px;height:24px;padding:0 7px;
  display:grid;place-items:center;font-size:13px;font-weight:700;font-family:var(--f-mono)}

/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:0 8px}
.cartbar .in{max-width:560px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cartbar .info{flex:1;min-width:0;background:none;border:0;color:inherit;text-align:left;padding:0}
.cartbar .info small{display:block;font-size:12px;opacity:.75}
.cartbar .info strong{font-family:var(--f-mono);font-size:20px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.block{width:100%;padding:15px;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .main .t{font-weight:600;overflow-wrap:anywhere}
.row .main .d{font-size:13px;color:var(--muted)}
.row .amt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 8px}
.pill.cash{background:var(--accent-soft);color:var(--cash)}
.pill.transfer{background:var(--transfer-soft);color:var(--transfer)}
.pill.low{background:var(--warn-soft);color:var(--warn)}
.pill.out{background:var(--danger-soft);color:var(--danger)}
.pill.void{background:var(--sunk);color:var(--muted)}
.voided .t,.voided .amt{text-decoration:line-through;color:var(--muted)}

.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* summary */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.kpi.big{grid-column:1/-1;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpi .l{font-size:12px;opacity:.75;font-weight:600}
.kpi .v{font-family:var(--f-mono);font-weight:600;font-size:20px;overflow-wrap:anywhere}
.kpi.big .v{font-size:32px}
.split{height:10px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex;margin-top:10px}
.split span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:8px;opacity:.85}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.daypick{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daypick button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px}
.daypick input{flex:1;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;height:40px;min-width:0}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.tile:active{transform:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet-h h2{margin:0}
.x{background:var(--sunk);border:0;border-radius:999px;width:34px;height:34px;font-size:18px;line-height:1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.f input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);font-weight:400;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--danger);font-size:13px;min-height:1em}
.sheet-foot{position:sticky;bottom:calc(-18px - env(safe-area-inset-bottom,0px));background:var(--bg);padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-18px - env(safe-area-inset-bottom,0px))}

.cartline{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cartline .main{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.stepper span{min-width:26px;text-align:center;font-family:var(--f-mono);font-weight:600}

.methods{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.method{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 10px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
.method svg{width:26px;height:26px}
.method[aria-pressed="true"].cash{border-color:var(--cash);background:var(--accent-soft);color:var(--cash)}
.method[aria-pressed="true"].transfer{border-color:var(--transfer);background:var(--transfer-soft);color:var(--transfer)}
.bills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bills button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-family:var(--f-mono);font-size:14px}
.change{display:flex;justify-content:space-between;align-items:baseline;padding:14px;border-radius:var(--r);background:var(--accent-soft);margin:10px 0}
.change.neg{background:var(--danger-soft)}
.change .v{font-family:var(--f-mono);font-size:26px;font-weight:600}
.totline{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px}
.totline .v{font-family:var(--f-mono);font-size:28px;font-weight:600}

/* receipt */
.ticket{background:var(--paper);color:var(--ink);font-family:var(--f-mono);font-size:13px;padding:18px 16px 22px;border:1px solid var(--line);
  border-radius:6px;margin:6px 0 14px;position:relative}
.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed var(--muted);margin:10px 0}
.ticket .r{display:flex;justify-content:space-between;gap:10px}
.ticket .r span:first-child{min-width:0;overflow-wrap:anywhere}
.ticket .tot{font-size:17px;font-weight:600}
.ok-mark{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:700;font-size:18px;margin:4px 0 4px}
.ok-mark svg{width:28px;height:28px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions > *{flex:1}
.confirm{background:var(--danger-soft);border-radius:var(--r);padding:12px;margin-top:10px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:5px}
.bar span{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="top">
    <div class="brand"><i></i>Caja Rápida</div>
    <div class="sync ok" id="sync"><b></b><span>Guardado en este celular</span></div>
  </header>
  <main id="view"></main>
</div>

<div class="cartbar" id="cartbar" hidden>
  <div class="in">
    <button class="info" id="cartOpen"><small id="cartCount"></small><strong id="cartTotal"></strong></button>
    <button class="btn" id="cartPay">Cobrar</button>
  </div>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button data-tab="vender"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Vender</button>
    <button data-tab="productos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Productos</button>
    <button data-tab="ventas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"/><path d="M9 7h6M9 11h6M9 15h4"/></svg>Ventas</button>
    <button data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
  </div>
</nav>

<div id="sheetRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
const LS_KEY = "caja-rapida.v1";
const ICON_CASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>';
const ICON_TRANSFER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>';
const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m7.5 12.5 3 3 6-6"/></svg>';
const METHOD_NAME = { efectivo: "Efectivo", transferencia: "Transferencia" };
const LOW_STOCK = 5;

const EXAMPLES = [
  ["Coca-Cola 500 ml", 1200, 24], ["Agua mineral 500 ml", 800, 30], ["Alfajor triple", 950, 18],
  ["Galletitas surtidas", 1500, 12], ["Pan lactal", 2300, 6], ["Leche entera 1 L", 1400, 10],
  ["Yerba 1 kg", 4800, 4], ["Chicles", 400, 40]
];

/* ---------- state ---------- */
let state = { products: [], sales: [], example: false };
let cart = {};               // productId -> qty
let tab = "vender";
let query = "";
let summaryDay = dayKey(Date.now());

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
const money = n => "$ " + (Math.round(n * 100) / 100).toLocaleString("es-AR", { minimumFractionDigits: Number.isInteger(Math.round(n * 100) / 100) ? 0 : 2, maximumFractionDigits: 2 });
const parseMoney = s => { if (s == null) return NaN; s = String(s).trim().replace(/\$/g, "").replace(/\s/g, ""); if (!s) return NaN;
  if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  return Number(s); };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtTime = ts => new Date(ts).toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
const fmtDate = ts => new Date(ts).toLocaleDateString("es-AR", { weekday: "long", day: "numeric", month: "long" });
const fmtDateShort = ts => new Date(ts).toLocaleDateString("es-AR", { day: "2-digit", month: "2-digit", year: "numeric" });
const productById = id => state.products.find(p => p.id === id);

function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && Array.isArray(s.products)) return s; } catch (e) {}
  return null;
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

function seedExamples() {
  state = { products: EXAMPLES.map(([name, price, stock]) => ({ id: uid(), name, price, stock })), sales: [], example: true };
}

/* ---------- saving (this phone only) ---------- */
function saveProducts() { saveLocal(); }
function saveDay() { saveLocal(); }

/* ---------- backup ---------- */
async function exportBackup() {
  const name = "caja-rapida-copia-" + dayKey(Date.now()) + ".json";
  const blob = new Blob([JSON.stringify({ app: "caja-rapida", version: 1, savedAt: Date.now(), ...state }, null, 1)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Copia de Caja Rápida" });
      localStorage.setItem(LS_KEY + ".lastBackup", String(Date.now()));
      render(); return;
    }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  try { localStorage.setItem(LS_KEY + ".lastBackup", String(Date.now())); } catch (e) {}
  render();
}
function importBackup(file) {
  const reader = new FileReader();
  reader.onload = () => {
    let data;
    try { data = JSON.parse(reader.result); } catch (e) { toast("Ese archivo no es una copia de Caja Rápida."); return; }
    if (!data || !Array.isArray(data.products) || !Array.isArray(data.sales)) { toast("Ese archivo no es una copia de Caja Rápida."); return; }
    openSheet(`<div class="sheet-h"><h2>Restaurar copia</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
      <p>La copia tiene <b>${data.products.length} productos</b> y <b>${data.sales.length} ventas</b>${data.savedAt ? `, guardada el ${fmtDateShort(data.savedAt)} a las ${fmtTime(data.savedAt)}` : ""}.</p>
      <div class="confirm"><span>Esto reemplaza todo lo que hay ahora en la app.</span>
      <div class="actions"><button class="btn ghost" data-close>Cancelar</button><button class="btn danger" id="rYes">Sí, restaurar</button></div></div>`, sheet => {
      sheet.querySelector("#rYes").addEventListener("click", () => {
        state = { products: data.products, sales: data.sales, example: !!data.example };
        cart = {}; saveLocal(); closeSheet(); tab = "vender"; render(); toast("Copia restaurada");
      });
    });
  };
  reader.readAsText(file);
}
function lastBackupText() {
  let t = null; try { t = Number(localStorage.getItem(LS_KEY + ".lastBackup")) || null; } catch (e) {}
  return t ? "Última copia: " + fmtDateShort(t) + " a las " + fmtTime(t) : "Todavía no hiciste ninguna copia.";
}

/* ---------- cart ---------- */
const cartItems = () => Object.entries(cart).map(([id, qty]) => ({ p: productById(id), qty })).filter(x => x.p && x.qty > 0);
const cartTotal = () => cartItems().reduce((t, x) => t + x.p.price * x.qty, 0);
const cartQty = () => cartItems().reduce((t, x) => t + x.qty, 0);
function pruneCart() { for (const id in cart) { const p = productById(id); if (!p) delete cart[id]; else if (cart[id] > p.stock) cart[id] = p.stock; if (cart[id] <= 0) delete cart[id]; } }
function addToCart(id, d = 1) {
  const p = productById(id); if (!p) return;
  const next = (cart[id] || 0) + d;
  if (next > p.stock) { toast(p.stock <= 0 ? "Sin stock de " + p.name : "Solo quedan " + p.stock + " de " + p.name); return; }
  if (next <= 0) delete cart[id]; else cart[id] = next;
}

/* ---------- views ---------- */
const view = document.getElementById("view");

function render() {
  document.querySelectorAll("nav.tabs button").forEach(b => { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  const banner = state.example ? `<div class="banner"><span>Estos son <b>productos de ejemplo</b> para que pruebes la app.</span><button id="clearEx">Empezar de cero</button></div>` : "";
  if (tab === "vender") view.innerHTML = banner + renderSell();
  if (tab === "productos") view.innerHTML = banner + renderProducts();
  if (tab === "ventas") view.innerHTML = renderSales();
  if (tab === "resumen") view.innerHTML = renderSummary();
  renderCartBar();
  const s = document.getElementById("q"); if (s) { s.value = query; }
}

function renderSell() {
  if (!state.products.length) return `<h2>Vender</h2><div class="empty"><strong>Todavía no cargaste productos</strong>Andá a <b>Productos</b> y agregá lo que vendés, con su precio y stock.</div>`;
  const q = query.trim().toLowerCase();
  const list = state.products.filter(p => !q || p.name.toLowerCase().includes(q) || (p.code || "").toLowerCase().includes(q));
  return `<h2>Vender</h2>
  <input class="search" id="q" type="search" placeholder="Buscar producto…" autocomplete="off">
  <div class="grid">${list.map(p => {
    const inCart = cart[p.id] || 0, left = p.stock - inCart;
    const cls = p.stock <= 0 ? "out" : (p.stock <= LOW_STOCK ? "low" : "");
    const stockTxt = p.stock <= 0 ? "Sin stock" : "Stock: " + left;
    return `<button class="tile ${cls}" data-add="${p.id}">
      ${inCart ? `<span class="q">${inCart}</span>` : ""}
      <span class="n">${esc(p.name)}</span><span class="s">${stockTxt}</span><span class="p">${money(p.price)}</span></button>`;
  }).join("") || `<div class="muted">No hay productos con “${esc(query)}”.</div>`}</div>`;
}

function renderProducts() {
  const sorted = [...state.products].sort((a, b) => a.name.localeCompare(b.name, "es"));
  const value = state.products.reduce((t, p) => t + p.price * Math.max(0, p.stock), 0);
  return `<div class="sheet-h"><h2>Productos</h2><button class="btn" id="newProd">+ Agregar</button></div>
  ${sorted.length ? `<p class="muted" style="margin:0 0 12px">${sorted.length} productos · mercadería en stock: <span class="num">${money(value)}</span></p>
  <div class="list">${sorted.map(p => {
    const pill = p.stock <= 0 ? '<span class="pill out">Sin stock</span>' : p.stock <= LOW_STOCK ? '<span class="pill low">Stock bajo</span>' : "";
    return `<button class="row" data-edit="${p.id}"><div class="main"><div class="t">${esc(p.name)}</div><div class="d">Stock: <span class="num">${p.stock}</span> ${pill}</div></div><div class="amt">${money(p.price)}</div></button>`;
  }).join("")}</div>`
  : `<div class="empty"><strong>Sin productos</strong>Tocá <b>+ Agregar</b> para cargar el primero.</div>`}`;
}

function renderSales() {
  if (!state.sales.length) return `<h2>Ventas</h2><div class="empty"><strong>Todavía no hay ventas</strong>Cuando cobres algo, aparece acá con fecha, hora y método de pago.</div>`;
  const groups = {};
  state.sales.forEach(s => (groups[dayKey(s.ts)] ||= []).push(s));
  return `<h2>Ventas</h2>` + Object.keys(groups).sort().reverse().map(day => {
    const list = groups[day];
    const tot = list.filter(s => !s.voided).reduce((t, s) => t + s.total, 0);
    return `<h3 style="display:flex;justify-content:space-between"><span>${fmtDate(list[0].ts)}</span><span class="num">${money(tot)}</span></h3>
    <div class="list">${list.map(s => `<button class="row ${s.voided ? "voided" : ""}" data-sale="${s.id}">
      <div class="main"><div class="t">${fmtTime(s.ts)} · ${s.items.reduce((t, i) => t + i.qty, 0)} art.</div>
      <div class="d">${s.voided ? '<span class="pill void">Anulada</span>' : `<span class="pill ${s.method === "efectivo" ? "cash" : "transfer"}">${METHOD_NAME[s.method]}</span>`} ${esc(s.items.map(i => i.name).join(", "))}</div></div>
      <div class="amt">${money(s.total)}</div></button>`).join("")}</div>`;
  }).join("");
}

function renderSummary() {
  const sales = state.sales.filter(s => dayKey(s.ts) === summaryDay && !s.voided);
  const voided = state.sales.filter(s => dayKey(s.ts) === summaryDay && s.voided).length;
  const total = sales.reduce((t, s) => t + s.total, 0);
  const cash = sales.filter(s => s.method === "efectivo").reduce((t, s) => t + s.total, 0);
  const transfer = total - cash;
  const items = sales.reduce((t, s) => t + s.items.reduce((a, i) => a + i.qty, 0), 0);
  const changeGiven = sales.reduce((t, s) => t + (s.change || 0), 0);
  const byProduct = {};
  sales.forEach(s => s.items.forEach(i => { const b = byProduct[i.name] ||= { qty: 0, amount: 0 }; b.qty += i.qty; b.amount += i.qty * i.price; }));
  const top = Object.entries(byProduct).sort((a, b) => b[1].amount - a[1].amount).slice(0, 6);
  const maxAmt = top.length ? top[0][1].amount : 1;
  const low = state.products.filter(p => p.stock <= LOW_STOCK).sort((a, b) => a.stock - b.stock);
  const [y, m, d] = summaryDay.split("-").map(Number);
  const isToday = summaryDay === dayKey(Date.now());
  return `<h2>Resumen ${isToday ? "de hoy" : "del día"}</h2>
  <div class="daypick"><button id="dPrev" aria-label="Día anterior">‹</button><input type="date" id="dPick" value="${summaryDay}"><button id="dNext" aria-label="Día siguiente">›</button></div>
  <p class="muted cap" style="margin:0 0 10px">${fmtDate(new Date(y, m - 1, d))}</p>
  <div class="kpis">
    <div class="kpi big"><div class="l">Total vendido</div><div class="v">${money(total)}</div>
      ${total ? `<div class="split"><span style="width:${cash / total * 100}%;background:var(--cash)"></span><span style="width:${transfer / total * 100}%;background:var(--transfer)"></span></div>
      <div class="legend"><span><i style="background:var(--cash)"></i>Efectivo ${Math.round(cash / total * 100)}%</span><span><i style="background:var(--transfer)"></i>Transferencia ${Math.round(transfer / total * 100)}%</span></div>` : ""}</div>
    <div class="kpi"><div class="l">Efectivo (debe haber en caja)</div><div class="v" style="color:var(--cash)">${money(cash)}</div></div>
    <div class="kpi"><div class="l">Transferencias</div><div class="v" style="color:var(--transfer)">${money(transfer)}</div></div>
    <div class="kpi"><div class="l">Ventas</div><div class="v">${sales.length}</div></div>
    <div class="kpi"><div class="l">Ticket promedio</div><div class="v">${money(sales.length ? total / sales.length : 0)}</div></div>
    <div class="kpi"><div class="l">Artículos vendidos</div><div class="v">${items}</div></div>
    <div class="kpi"><div class="l">Vuelto entregado</div><div class="v">${money(changeGiven)}</div></div>
  </div>
  ${voided ? `<p class="muted" style="font-size:13px">${voided} venta${voided > 1 ? "s" : ""} anulada${voided > 1 ? "s" : ""} (no suman al total).</p>` : ""}
  <h3>Lo más vendido</h3>
  ${top.length ? `<div class="list">${top.map(([name, b]) => `<div class="row"><div class="main"><div class="t">${esc(name)}</div><div class="d">${b.qty} unidades</div><div class="bar"><span style="width:${b.amount / maxAmt * 100}%"></span></div></div><div class="amt">${money(b.amount)}</div></div>`).join("")}</div>`
    : `<div class="empty">No hubo ventas este día.</div>`}
  <h3>Para reponer</h3>
  ${low.length ? `<div class="list">${low.map(p => `<button class="row" data-edit="${p.id}"><div class="main"><div class="t">${esc(p.name)}</div></div><span class="pill ${p.stock <= 0 ? "out" : "low"}">${p.stock <= 0 ? "Sin stock" : "Quedan " + p.stock}</span></button>`).join("")}</div>`
    : `<p class="muted">Todos los productos tienen más de ${LOW_STOCK} unidades.</p>`}
  <h3>Copia de seguridad</h3>
  <div class="kpi" style="display:flex;flex-direction:column;gap:10px">
    <span style="font-size:14px">Tus datos están guardados solo en este celular. Hacé una copia cada tanto y guardala en Archivos, Drive o mandatela por WhatsApp.</span>
    <span class="muted" style="font-size:13px">${lastBackupText()}</span>
    <div class="actions"><button class="btn" id="bExport">Hacer copia</button><label class="btn ghost" style="text-align:center;cursor:pointer">Restaurar copia<input type="file" id="bImport" accept="application/json,.json" hidden></label></div>
  </div>`;
}

function renderCartBar() {
  const bar = document.getElementById("cartbar");
  const n = cartQty();
  bar.hidden = !(tab === "vender" && n > 0);
  document.getElementById("cartCount").textContent = n + (n === 1 ? " artículo · ver detalle" : " artículos · ver detalle");
  document.getElementById("cartTotal").textContent = money(cartTotal());
}

/* ---------- sheets ---------- */
const sheetRoot = document.getElementById("sheetRoot");
function openSheet(html, onMount) {
  sheetRoot.innerHTML = `<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  // ignore the tail of the tap that opened this sheet, so it can't close it right away
  const openedAt = Date.now(), close = () => { if (Date.now() - openedAt > 450) closeSheet(); };
  document.getElementById("scrim").addEventListener("click", e => { if (e.target.id === "scrim") close(); });
  sheetRoot.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", close));
  onMount && onMount(sheetRoot.querySelector(".sheet"));
}
function closeSheet() { sheetRoot.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

function productSheet(id) {
  const p = id ? productById(id) : null;
  openSheet(`<div class="sheet-h"><h2>${p ? "Editar producto" : "Nuevo producto"}</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
  <form id="pf" class="stack" style="margin-top:14px" novalidate>
    <label class="f">Nombre<input id="pName" required maxlength="80" value="${p ? esc(p.name) : ""}" placeholder="Ej: Coca-Cola 500 ml"></label>
    <div class="two">
      <label class="f">Precio de venta<input id="pPrice" inputmode="decimal" value="${p ? String(p.price).replace(".", ",") : ""}" placeholder="0"></label>
      <label class="f">Stock (unidades)<input id="pStock" inputmode="numeric" value="${p ? p.stock : ""}" placeholder="0"></label>
    </div>
    ${p ? `<div class="two"><button type="button" class="btn ghost" id="pAdd">+ Sumar stock</button><span></span></div>` : ""}
    <label class="f">Código (opcional)<input id="pCode" maxlength="40" value="${p && p.code ? esc(p.code) : ""}" placeholder="Para buscarlo más rápido"></label>
    <div class="err" id="pErr"></div>
    <button class="btn block" type="submit">${p ? "Guardar cambios" : "Agregar producto"}</button>
    ${p ? `<button type="button" class="btn ghost block" id="pDel" style="color:var(--danger)">Eliminar producto</button><div id="pDelBox"></div>` : ""}
  </form>`, sheet => {
    if (!p) sheet.querySelector("#pName").focus();
    sheet.querySelector("#pf").addEventListener("submit", e => {
      e.preventDefault();
      const name = sheet.querySelector("#pName").value.trim();
      const price = parseMoney(sheet.querySelector("#pPrice").value);
      const stock = Number(sheet.querySelector("#pStock").value.trim() || 0);
      const code = sheet.querySelector("#pCode").value.trim();
      const err = sheet.querySelector("#pErr");
      if (!name) return err.textContent = "Escribí el nombre del producto.";
      if (!(price >= 0) || isNaN(price)) return err.textContent = "El precio tiene que ser un número, por ejemplo 1500 o 1500,50.";
      if (!Number.isInteger(stock) || stock < 0) return err.textContent = "El stock tiene que ser un número entero, 0 o más.";
      if (p) Object.assign(p, { name, price, stock, code });
      else state.products.push({ id: uid(), name, price, stock, code });
      pruneCart(); saveProducts(); closeSheet(); render();
      toast(p ? "Producto guardado" : "Producto agregado");
    });
    const add = sheet.querySelector("#pAdd");
    add && add.addEventListener("click", () => {
      const box = document.createElement("div");
      box.className = "two";
      box.innerHTML = `<label class="f">¿Cuántas unidades llegaron?<input id="pInc" inputmode="numeric" placeholder="0"></label><button type="button" class="btn" id="pIncOk" style="align-self:end">Sumar</button>`;
      add.parentElement.replaceWith(box);
      box.querySelector("#pInc").focus();
      box.querySelector("#pIncOk").addEventListener("click", () => {
        const n = Number(box.querySelector("#pInc").value.trim());
        if (!Number.isInteger(n) || n <= 0) { sheet.querySelector("#pErr").textContent = "Poné una cantidad entera mayor a 0."; return; }
        const st = sheet.querySelector("#pStock"); st.value = Number(st.value || 0) + n;
        box.querySelector("#pInc").value = ""; sheet.querySelector("#pErr").textContent = "";
        toast("Stock nuevo: " + st.value + ". Tocá Guardar cambios.");
      });
    });
    const del = sheet.querySelector("#pDel");
    del && del.addEventListener("click", () => {
      sheet.querySelector("#pDelBox").innerHTML = `<div class="confirm"><span>¿Eliminar <b>${esc(p.name)}</b>? Las ventas anteriores no se borran.</span>
        <div class="actions"><button type="button" class="btn ghost" id="pNo">Cancelar</button><button type="button" class="btn danger" id="pYes">Sí, eliminar</button></div></div>`;
      sheet.querySelector("#pNo").addEventListener("click", () => sheet.querySelector("#pDelBox").innerHTML = "");
      sheet.querySelector("#pYes").addEventListener("click", () => {
        state.products = state.products.filter(x => x.id !== p.id); delete cart[p.id];
        saveProducts(); closeSheet(); render(); toast("Producto eliminado");
      });
    });
  });
}

function cartSheet() {
  const draw = () => {
    const items = cartItems();
    if (!items.length) { closeSheet(); render(); return; }
    sheetRoot.querySelector("#cl").innerHTML = items.map(({ p, qty }) => `<div class="cartline"><div class="main"><div style="font-weight:600;overflow-wrap:anywhere">${esc(p.name)}</div><div class="muted num" style="font-size:13px">${money(p.price)} c/u · ${money(p.price * qty)}</div></div>
      <div class="stepper"><button data-d="-1" data-id="${p.id}" aria-label="Quitar uno">−</button><span>${qty}</span><button data-d="1" data-id="${p.id}" aria-label="Sumar uno">+</button></div></div>`).join("");
    sheetRoot.querySelector("#ct").textContent = money(cartTotal());
  };
  openSheet(`<div class="sheet-h"><h2>Venta actual</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
    <div id="cl"></div>
    <div class="totline"><span style="font-weight:700">Total</span><span class="v" id="ct"></span></div>
    <div class="actions" style="margin-top:10px"><button class="btn ghost" id="cEmpty">Vaciar</button><button class="btn" id="cPay">Cobrar</button></div>`, sheet => {
    draw();
    sheet.addEventListener("click", e => {
      const b = e.target.closest("[data-d]"); if (!b) return;
      addToCart(b.dataset.id, Number(b.dataset.d)); draw(); render();
    });
    sheet.querySelector("#cEmpty").addEventListener("click", () => { cart = {}; closeSheet(); render(); });
    sheet.querySelector("#cPay").addEventListener("click", paySheet);
  });
}

function paySheet() {
  const total = cartTotal();
  if (!total && !cartQty()) return;
  let method = "efectivo";
  const bills = [...new Set([Math.ceil(total / 100) * 100, Math.ceil(total / 500) * 500, Math.ceil(total / 1000) * 1000, Math.ceil(total / 2000) * 2000, Math.ceil(total / 10000) * 10000, Math.ceil(total / 20000) * 20000])].filter(v => v >= total).slice(0, 5);
  openSheet(`<div class="sheet-h"><h2>Cobrar</h2><button class="x" data-close aria-label="Cerrar">×</button></div>
    <div class="totline"><span style="font-weight:700">Total a cobrar</span><span class="v">${money(total)}</span></div>
    <div class="methods">
      <button class="method cash" data-m="efectivo" aria-pressed="true">${ICON_CASH}Efectivo</button>
      <button class="method transfer" data-m="transferencia" aria-pressed="false">${ICON_TRANSFER}Transferencia</button>
    </div>
    <div id="cashBox">
      <label class="f">¿Con cuánto paga?<input id="recv" inputmode="decimal" placeholder="${money(total)}" autocomplete="off"></label>
      <div class="bills"><button data-b="${total}">Justo</button>${bills.filter(b => b !== total).map(b => `<button data-b="${b}">${money(b)}</button>`).join("")}</div>
      <div class="change" id="chg"><span style="font-weight:700">Vuelto</span><span class="v">${money(0)}</span></div>
    </div>
    <div id="trBox" hidden><p class="muted" style="margin:0 0 12px">Revisá que la transferencia te haya llegado antes de confirmar.</p></div>
    <div class="sheet-foot"><div class="err" id="payErr" role="alert"></div>
    <button type="button" class="btn block" id="confirm">Confirmar cobro</button></div>`, sheet => {
    const recv = sheet.querySelector("#recv");
    const err = msg => { sheet.querySelector("#payErr").textContent = msg; toast(msg); };
    const chg = sheet.querySelector("#chg");
    const update = () => {
      const r = recv.value.trim() ? parseMoney(recv.value) : total;
      const c = r - total;
      chg.classList.toggle("neg", c < 0);
      chg.querySelector("span").textContent = c < 0 ? "Falta" : "Vuelto";
      chg.querySelector(".v").textContent = isNaN(c) ? "—" : money(Math.abs(c));
    };
    recv.addEventListener("input", update);
    sheet.querySelectorAll("[data-b]").forEach(b => b.addEventListener("click", () => { recv.value = String(b.dataset.b).replace(".", ","); update(); }));
    sheet.querySelectorAll("[data-m]").forEach(b => b.addEventListener("click", () => {
      method = b.dataset.m;
      sheet.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      sheet.querySelector("#cashBox").hidden = method !== "efectivo";
      sheet.querySelector("#trBox").hidden = method !== "transferencia";
      sheet.querySelector("#payErr").textContent = "";
    }));
    update();
    let busy = false;
    const confirm = () => {
      if (busy) return;
      recv.blur();
      let received = total, change = 0;
      if (method === "efectivo") {
        received = recv.value.trim() ? parseMoney(recv.value) : total;
        if (isNaN(received)) return err("El monto recibido no es un número válido. Escribilo solo con números, por ejemplo 5000.");
        if (received < total - 0.001) return err("Faltan " + money(total - received) + ". El cliente tiene que pagar al menos el total.");
        change = Math.round((received - total) * 100) / 100;
      }
      busy = true;
      try {
        const msg = completeSale(method, received, change);
        if (msg) { busy = false; err(msg); }
      } catch (e) {
        busy = false;
        err("No se pudo registrar el cobro (" + (e && e.message ? e.message : e) + "). Mandale este mensaje a quien te armó la app.");
      }
    };
    // pointerup fires even when the tap also closes the phone keyboard and shifts the layout
    const btn = sheet.querySelector("#confirm");
    btn.addEventListener("click", confirm);
    btn.addEventListener("pointerup", e => { if (e.pointerType !== "mouse") { e.preventDefault(); confirm(); } });
    recv.setAttribute("enterkeyhint", "done");
    recv.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); recv.blur(); } });
  });
}

function completeSale(method, received, change) {
  const items = cartItems();
  if (!items.length) { closeSheet(); render(); return "La venta quedó vacía. Volvé a elegir los productos."; }
  for (const { p, qty } of items) if (qty > p.stock) return "No alcanza el stock de " + p.name + " (quedan " + p.stock + ").";
  const total = cartTotal();
  if (method === "efectivo" && received < total - 0.001) return "El total cambió a " + money(total) + ". Revisá el monto recibido.";
  if (method !== "efectivo") received = total;
  change = method === "efectivo" ? Math.round((received - total) * 100) / 100 : 0;
  const sale = { id: uid(), ts: Date.now(), method, total, received, change,
    items: items.map(({ p, qty }) => ({ productId: p.id, name: p.name, price: p.price, qty })) };
  items.forEach(({ p, qty }) => { p.stock -= qty; });
  state.sales.unshift(sale);
  cart = {};
  saveProducts(); saveDay(dayKey(sale.ts));
  render();
  receiptSheet(sale, true);
}

function ticketHtml(s) {
  return `<div class="ticket">
    <div class="c" style="font-weight:600;font-size:15px">CAJA RÁPIDA</div>
    <div class="c">${fmtDateShort(s.ts)} · ${fmtTime(s.ts)}</div>
    <div class="c muted">Venta #${s.id.slice(-6).toUpperCase()}</div>
    <hr>
    ${s.items.map(i => `<div class="r"><span>${i.qty} × ${esc(i.name)}</span><span>${money(i.qty * i.price)}</span></div>`).join("")}
    <hr>
    <div class="r tot"><span>TOTAL</span><span>${money(s.total)}</span></div>
    <div class="r"><span>Pago</span><span>${METHOD_NAME[s.method]}</span></div>
    ${s.method === "efectivo" ? `<div class="r"><span>Recibido</span><span>${money(s.received)}</span></div><div class="r"><span>Vuelto</span><span>${money(s.change)}</span></div>` : ""}
    ${s.voided ? `<hr><div class="c" style="color:var(--danger);font-weight:600">VENTA ANULADA</div>` : ""}
  </div>`;
}

function receiptSheet(s, fresh) {
  openSheet(`<div class="sheet-h">${fresh ? `<div class="ok-mark">${ICON_OK}Cobro registrado</div>` : `<h2>Detalle de venta</h2>`}<button class="x" data-close aria-label="Cerrar">×</button></div>
    ${fresh && s.method === "efectivo" && s.change > 0 ? `<div class="change"><span style="font-weight:700">Dale de vuelto</span><span class="v">${money(s.change)}</span></div>` : ""}
    ${ticketHtml(s)}
    <div class="actions">${fresh ? `<button class="btn block" data-close>Nueva venta</button>` : (s.voided ? "" : `<button class="btn ghost" id="void" style="color:var(--danger)">Anular venta</button>`) + `<button class="btn" data-close>Listo</button>`}</div>
    <div id="voidBox"></div>`, sheet => {
    const v = sheet.querySelector("#void");
    v && v.addEventListener("click", () => {
      sheet.querySelector("#voidBox").innerHTML = `<div class="confirm"><span>¿Anular esta venta? Los productos vuelven al stock y el monto deja de sumar en el resumen.</span>
        <div class="actions"><button class="btn ghost" id="vNo">Cancelar</button><button class="btn danger" id="vYes">Sí, anular</button></div></div>`;
      sheet.querySelector("#vNo").addEventListener("click", () => sheet.querySelector("#voidBox").innerHTML = "");
      sheet.querySelector("#vYes").addEventListener("click", () => {
        s.voided = true;
        s.items.forEach(i => { const p = productById(i.productId); if (p) p.stock += i.qty; });
        saveProducts(); saveDay(dayKey(s.ts)); closeSheet(); render(); toast("Venta anulada, stock devuelto");
      });
    });
  });
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400);
}

/* ---------- events ---------- */
document.querySelector("nav.tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; render(); window.scrollTo(0, 0);
});
view.addEventListener("click", e => {
  const t = e.target;
  const add = t.closest("[data-add]"); if (add) { addToCart(add.dataset.add); render(); return; }
  const ed = t.closest("[data-edit]"); if (ed) { productSheet(ed.dataset.edit); return; }
  const sa = t.closest("[data-sale]"); if (sa) { const s = state.sales.find(x => x.id === sa.dataset.sale); s && receiptSheet(s, false); return; }
  if (t.closest("#newProd")) { productSheet(null); return; }
  if (t.closest("#clearEx")) {
    state = { products: [], sales: [], example: false }; cart = {};
    saveProducts();
    tab = "productos"; render(); toast("Listo. Cargá tus productos."); return;
  }
  if (t.closest("#bExport")) { exportBackup(); return; }
  if (t.closest("#dPrev") || t.closest("#dNext")) {
    const [y, m, d] = summaryDay.split("-").map(Number);
    summaryDay = dayKey(new Date(y, m - 1, d + (t.closest("#dPrev") ? -1 : 1)).getTime()); render();
  }
});
view.addEventListener("input", e => {
  if (e.target.id === "q") {
    query = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const s = document.getElementById("q"); s.focus(); try { s.setSelectionRange(pos, pos); } catch (_) {}
  }
});
view.addEventListener("change", e => { if (e.target.id === "bImport" && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; return; } if (e.target.id === "dPick" && e.target.value) { summaryDay = e.target.value; render(); } });
document.getElementById("cartOpen").addEventListener("click", cartSheet);
document.getElementById("cartPay").addEventListener("click", paySheet);

/* ---------- boot ---------- */
const local = loadLocal();
if (local) state = Object.assign({ products: [], sales: [], example: false }, local);
else { seedExamples(); saveLocal(); }
render();
// ask the phone not to clear our data when it runs low on space
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
